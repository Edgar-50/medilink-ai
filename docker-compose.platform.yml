services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: medilink
      POSTGRES_USER: medilink
      POSTGRES_PASSWORD: medilink_local
    ports: ["5432:5432"]
    volumes: ["medilink_postgres:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  mosquitto:
    image: eclipse-mosquitto:2
    ports: ["1883:1883", "9001:9001"]
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://medilink:medilink_local@postgres:5432/medilink
      REDIS_URL: redis://redis:6379/0
      MQTT_BROKER: mosquitto
    ports: ["8000:8000"]
    depends_on: [postgres, redis, mosquitto]
volumes:
  medilink_postgres:
