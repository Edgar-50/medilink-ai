services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: medilink
      POSTGRES_USER: medilink
      POSTGRES_PASSWORD: medilink
    ports:
      - "5432:5432"
    volumes:
      - medilink_db:/var/lib/postgresql/data

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://medilink:medilink@db:5432/medilink
      SECRET_KEY: change-me-in-production
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  medilink_db:
